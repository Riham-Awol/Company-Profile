    <title>X Solvd — Software engineered for real-world problems</title>
    <meta name="description" content="X Solvd designs, builds and supports custom software, web and mobile platforms." />
    <script>
      // Apply the saved (or OS-preferred) theme before first paint.
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
